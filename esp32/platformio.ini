; HHRCS ESP32 BLE Bridge v2 — Magic-Pocket-Control-ESP32 library
[env:hhrcs-bridge]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DUSING_TFT_ESPI=0
    -DUSING_M5GFX=0
    -DUSING_M5_BUTTONS=0
lib_deps =
    arduino-libraries/Arduino_DebugUtils@^1.4.0
