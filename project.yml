name: HHRCS
options:
  bundleIdPrefix: com.brandonpoole
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.4"

targets:
  HHRCS:
    type: application
    platform: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - path: HHRCS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brandonpoole.hhrcs
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: HHRCS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        NSHumanReadableCopyright: "© 2025 Brandon Poole"
    entitlements:
      path: HHRCS/HHRCS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
